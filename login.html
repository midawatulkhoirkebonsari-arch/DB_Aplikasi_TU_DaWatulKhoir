<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login SI-MADRASAH - MI Da'watul Khoir</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-emerald-950 flex items-center justify-center h-screen font-sans">

    <div class="bg-white p-8 rounded-2xl shadow-2xl w-96 text-center">
        <!-- Logo Madrasah -->
        <div class="flex justify-center mb-4">
            <img src="logo-madrasah.png" alt="Logo Madrasah" class="w-20 h-20 object-contain rounded-full border-2 border-emerald-600 p-1 bg-emerald-50">
        </div>

        <h2 class="text-xl font-extrabold text-emerald-900">SI - MADRASAH</h2>
        <p class="text-xs text-gray-500 mb-6">MI Da'watul Khoir Kebonsari</p>

        <!-- Form Login -->
        <form onsubmit="prosesLogin(event)" class="space-y-4 text-left">
            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">PILIH AKSES MASUK</label>
                <select id="role" class="w-full border border-gray-300 p-2.5 rounded-lg text-sm focus:outline-none focus:border-emerald-600">
                    <option value="tu">Staf Tata Usaha / Admin</option>
                    <option value="guru">Dewan Guru / Wali Kelas</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold text-gray-700 mb-1">MASUKKAN PIN / SANDI</label>
                <input type="password" id="pin" placeholder="Masukkan PIN..." required class="w-full border border-gray-300 p-2.5 rounded-lg text-sm focus:outline-none focus:border-emerald-600">
            </div>

            <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-800 text-white font-bold p-2.5 rounded-lg transition text-sm">
                <i class="fa-solid fa-right-to-bracket mr-2"></i> Masuk Sistem
            </button>
        </form>

        <div class="mt-6 text-xs text-gray-400">
            <a href="index.html" class="hover:underline text-emerald-700"><i class="fa-solid fa-arrow-left mr-1"></i> Kembali ke Beranda Utama</a>
        </div>
    </div>

    <script>
        function prosesLogin(e) {
            e.preventDefault();
            const role = document.getElementById('role').value;
            const pin = document.getElementById('pin').value;

            // PIN Akses Masuk
            if (role === 'tu' && pin === 'tu2026') {
                localStorage.setItem('status_login', 'TU_AKTIF');
                alert('Login Berhasil sebagai Staf Tata Usaha!');
                window.location.href = 'dashboard-tu.html';
            } 
            else if (role === 'guru' && pin === 'guru2026') {
                localStorage.setItem('status_login', 'GURU_AKTIF');
                alert('Login Berhasil sebagai Dewan Guru / Wali Kelas!');
                window.location.href = 'dashboard-guru.html'; // Mengarahkan ke halaman khusus guru
            } 
            else {
                alert('PIN atau Hak Akses yang Anda masukkan salah!\n\nCatatan:\n- PIN TU: tu2026\n- PIN Guru: guru2026');
            }
        }
    </script>
</body>
</html>
